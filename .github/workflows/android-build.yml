name: android-build

# Builds the signed Android App Bundle (.aab) + APK from the committed Capacitor
# Gradle project at android/ (web bundle from client/). Manual trigger only.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64      base64 of android.keystore (alias oneonone-upload)
#   ANDROID_KEYSTORE_PASSWORD    keystore store password
#   ANDROID_KEY_PASSWORD         oneonone-upload key password
#   GOOGLE_SERVICES_JSON_BASE64  base64 of android/app/google-services.json (FCM)
#   VITE_SUPABASE_URL            Supabase project URL, baked into the web bundle
#   VITE_SUPABASE_ANON_KEY       Supabase anon key (public), baked into the bundle
#
# The keystore is the UPLOAD key registered with Play App Signing and with the
# Google OAuth Android client. This workflow never generates a keystore: a
# missing secret fails the run, the restored keystore's SHA-1 is asserted before
# the build, and the produced AAB/APK signer SHA-1 is asserted after it. Nothing
# is uploaded unless both match EXPECTED_UPLOAD_KEY_SHA1.
#
# Runbook: docs/playstore/ANDROID_BUILD.md

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode (integer, must strictly increase per Play upload)"
        required: true
        default: "1"
      versionName:
        description: "versionName (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

env:
  EXPECTED_UPLOAD_KEY_SHA1: "36:A9:69:D6:10:20:E0:7E:33:79:9F:0C:04:CE:F5:1A:63:BB:90:C6"
  EXPECTED_UPLOAD_KEY_SHA256: "4B:0E:07:42:D4:9B:3A:30:4F:43:C1:3F:44:1E:62:06:91:CE:98:A8:A9:D6:09:5F:E0:71:0F:30:74:C6:74:57"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Require all secrets (no keystore generation path exists)
        env:
          S_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          S_KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          S_KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          S_GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          S_SU: ${{ secrets.VITE_SUPABASE_URL }}
          S_SK: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -n "$S_KS" ]  || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$S_KSP" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$S_KP" ]  || missing="$missing ANDROID_KEY_PASSWORD"
          [ -n "$S_GS" ]  || missing="$missing GOOGLE_SERVICES_JSON_BASE64"
          [ -n "$S_SU" ]  || missing="$missing VITE_SUPABASE_URL"
          [ -n "$S_SK" ]  || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build web bundle
        working-directory: client
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync web bundle + native plugins into android/
        working-directory: client
        run: npx cap sync android

      - name: Materialize signing + Firebase config from secrets
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          node -e "JSON.parse(require('fs').readFileSync('app/google-services.json','utf8'))"
          {
            echo "storeFile=android.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=oneonone-upload"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Assert the restored keystore is the oneonone-upload key
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          keytool -list -v -keystore android.keystore -alias oneonone-upload \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" > keystore-cert.txt
          grep -E "SHA1:|SHA256:" keystore-cert.txt
          if ! grep -q "SHA1: $EXPECTED_UPLOAD_KEY_SHA1" keystore-cert.txt; then
            echo "::error::Restored keystore SHA-1 does not match the oneonone-upload key. Refusing to build."
            exit 1
          fi
          if ! grep -q "SHA256: $EXPECTED_UPLOAD_KEY_SHA256" keystore-cert.txt; then
            echo "::warning::Keystore SHA-256 differs from client/public/.well-known/assetlinks.json"
          fi
          rm -f keystore-cert.txt

      - name: Build signed AAB + APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ inputs.versionCode }}
          APP_VERSION_NAME: ${{ inputs.versionName }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME"

      - name: Verify the AAB + APK are signed with the upload key
        working-directory: android
        run: |
          set -e
          AAB=app/build/outputs/bundle/release/app-release.aab
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$AAB" || { echo "::error::$AAB not produced"; exit 1; }
          test -f "$APK" || { echo "::error::$APK not produced"; exit 1; }

          echo "== AAB signer =="
          keytool -printcert -jarfile "$AAB" > aab-cert.txt
          grep -E "SHA1:|SHA256:" aab-cert.txt
          if ! grep -q "SHA1: $EXPECTED_UPLOAD_KEY_SHA1" aab-cert.txt; then
            echo "::error::AAB is NOT signed with the oneonone-upload key"
            exit 1
          fi

          echo "== APK signer =="
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" > apk-cert.txt
          grep -E "SHA-1 digest|SHA-256 digest" apk-cert.txt
          WANT_SHA1="$(printf "%s" "$EXPECTED_UPLOAD_KEY_SHA1" | tr -d ":" | tr "A-F" "a-f")"
          if ! grep -q "SHA-1 digest: $WANT_SHA1" apk-cert.txt; then
            echo "::error::APK is NOT signed with the oneonone-upload key"
            exit 1
          fi

          echo "== APK version =="
          "$(dirname "$APKSIGNER")/aapt2" dump badging "$APK" | grep "^package:"
          rm -f aab-cert.txt apk-cert.txt

      - name: Upload AAB + APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Scrub secrets from the workspace
        if: always()
        working-directory: android
        run: rm -f android.keystore keystore.properties app/google-services.json

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>One on One</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0d1117" />
    <!--
      Mirrors the CSP that vercel.json serves as a response header, so the
      Capacitor build (served from https://localhost, no Vercel headers) is
      covered too. 'self' resolves to the serving origin in both cases.
      frame-ancestors / X-Frame-Options stay header-only (ignored in <meta>).
      Keep this in sync with vercel.json.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.railway.app wss://*.railway.app https://*.up.railway.app wss://*.up.railway.app; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Get One on One on Google Play.">
  <title>One on One — Google Play</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff;color:#171717;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:340px;width:100%;text-align:center}
    h1{font-size:23px;line-height:1.3;font-weight:600;letter-spacing:-.5px;margin:0 0 12px}
    p{margin:0 0 24px;color:#666;font-size:14px;line-height:1.6}
    a{display:block;border-radius:9px;background:#171717;color:white;text-decoration:none;padding:13px 18px;font-size:14px;font-weight:600}
    small{display:block;margin-top:17px;color:#777;font-size:12px;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <h1>One on One</h1>
    <p>Opening Google Play…</p>
    <a id="open-store" href="intent://details?id=app.web.oneonone#Intent;scheme=market;package=com.android.vending;action=android.intent.action.VIEW;end">Open Google Play</a>
    <small>If nothing opens, tap the button. Instagram may require you to open this page in your browser.</small>
  </main>
  <script>
    (function () {
      const playUrl = 'https://play.google.com/store/apps/details?id=app.web.oneonone';
      const marketUrl = 'market://details?id=app.web.oneonone';
      const button = document.getElementById('open-store');
      const android = /Android/i.test(navigator.userAgent);
      if (!android) {
        button.href = playUrl;
        window.location.replace(playUrl);
        return;
      }
      // Browsers may deny automatic external app launches without user activation.
      // Keep the explicit, user-tapped intent link available as a fallback.
      try { window.location.assign(marketUrl); } catch (_) {}
    })();
  </script>
</body>
</html>
